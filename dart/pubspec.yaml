name: apiverve_airlinelookup
description: "Airline Lookup is an airline codes API that matches IATA codes and airline names to carrier profiles, returning the official title, callsign, registration country, whether the carrier is still operating, and low-cost status. Paid tiers add the country's ISO code, three-letter ICAO code lookups and carrier logo URLs."
version: 1.2.5
homepage: https://apiverve.com/marketplace/airlinelookup?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/airlinelookup-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
